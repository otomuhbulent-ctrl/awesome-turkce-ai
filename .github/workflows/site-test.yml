name: Site Testi

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # README biçimi değişip site bozulursa PR'da yakalanır
      - run: node --test "site/*.test.mjs"
